<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>AnimeTier</title>
    
    <!-- PWA & Metadatos -->
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Fuentes, Iconos y Librerías Externas -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Hoja de Estilos Principal -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-main">
    <!-- Contenedor Principal montado por JavaScript -->
    <div id="app"></div>
    <!-- Contenedor para Notificaciones Toast -->
    <div class="tw" id="tw"></div>

    <!-- 
      ======================================================
      CARGA SECUENCIAL DE MÓDULOS JAVASCRIPT
      El atributo "defer" asegura que se ejecuten en este 
      mismo orden exacto justo después de parsear el HTML.
      ====================================================== 
    -->
    
    <!-- 1. Configuración de Red, Constantes y Diccionarios -->
    <script defer src="js/data/config.js"></script>
    <script defer src="js/data/characters.js"></script>
    
    <!-- 2. Núcleo: Estado Global, LocalStorage y Motor de Arrastre -->
    <script defer src="js/core/store.js"></script>
    <script defer src="js/core/dragdrop.js"></script>
    
    <!-- 3. Servicios: Auth, Fetching y Sincronización con Supabase -->
    <script defer src="js/services/api.js"></script>
    
    <!-- 4. UI: Vistas, HTML Dinámico y Enrutamiento -->
    <script defer src="js/ui/components.js"></script>
    
    <!-- 5. App: Archivo que da el pistoletazo de salida (Init) -->
    <script defer src="js/app.js"></script>
</body>
</html>
