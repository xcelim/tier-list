<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AnimeTier</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0/default.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;
  --border:#2a2a45;--border2:#3a3a60;
  --text:#e8e8f0;--text2:#9090b0;--text3:#5050a0;
  --accent:#7c5cbf;--accent2:#9b7dd4;--accentbg:#7c5cbf22;
  --red:#e05555;--green:#55c87d;--gold:#f0b429;
  --glass:rgba(18,18,26,0.8);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body.bg-main{background:none}
body.bg-main::before{content:"";position:fixed;inset:0;background:#0a0a0f url('resources/homebkg.png') center/cover;filter:blur(1px) brightness(0.5);z-index:-1}
body.bg-main::after{content:"";position:fixed;bottom:-150px;left:0;right:0;height:450px;background:radial-gradient(circle at center,rgba(0,140,255,0.35) 0%,transparent 75%);z-index:-1;pointer-events:none}
h1,h2,h3,.hf{font-family:'Rajdhani',sans-serif;letter-spacing:.5px}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 11px;font-size:13px;outline:none;transition:.15s}
input::placeholder{color:var(--text3)}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentbg)}

/* NAV */
nav{background:rgba(10,10,15,0.75);backdrop-filter:blur(15px);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 16px;display:flex;align-items:center;gap:10px;height:52px;position:sticky;top:0;z-index:300}
.logo{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--accent2),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;letter-spacing:2px;flex-shrink:0}
.ntab{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:.15s}
.ntab:hover{background:var(--bg3);color:var(--text)}
.ntab.on{background:var(--accentbg);color:var(--accent2)}
.nav-right{margin-left:auto;display:flex;gap:8px;align-items:center}


/* PROFILES */
.profile-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;cursor:pointer;border:2px solid var(--border);transition:.2s;flex-shrink:0;position:relative}
.profile-btn:hover{transform:scale(1.1);border-color:var(--accent2)}
.profile-btn.active{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,180,41,.2)}
.profile-btn .online-dot{position:absolute;bottom:0;right:0;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid var(--bg2)}
.profile-menu{position:absolute;top:58px;right:16px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:8px;min-width:180px;z-index:400;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:slideDown .18s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.pm-header{padding:8px 10px;border-bottom:1px solid var(--border);margin-bottom:4px}
.pm-name{font-weight:600;font-size:13px;font-family:'Rajdhani',sans-serif}
.pm-sub{font-size:10px;color:var(--text3);margin-top:2px}
.pm-item{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:.12s;display:flex;align-items:center;gap:8px}
.pm-item:hover{background:var(--bg3);color:var(--text)}
.pm-item.danger{color:var(--red)}
.pm-divider{height:1px;background:var(--border);margin:4px 0}

/* BUTTONS */
.btn{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:500;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.15s;white-space:nowrap}
.bp{background:var(--accent);color:#fff}.bp:hover{background:var(--accent2)}
.bg{border-color:var(--border);color:var(--text2)}.bg:hover{background:var(--bg3);color:var(--text)}
.bd{color:var(--red);border-color:#e0555433}.bd:hover{background:#e0555422}
.bsm{padding:3px 9px;font-size:11px}
.btn-save{background:linear-gradient(135deg,var(--green),#2ecc71);color:#fff;border:none;font-weight:600}
.btn-save:hover{filter:brightness(1.1)}

/* MAIN */
main{padding:14px;max-width:1320px;margin:0 auto}

/* HOME */
.hh{text-align:center;padding:60px 0 10px;display:flex;flex-direction:column;align-items:center}
.hh h1{font-size:72px;font-weight:800;background:linear-gradient(135deg,var(--accent2) 0%,#c084fc 50%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;font-family:'Cinzel',serif;letter-spacing:2px;line-height:1}
.hh .hh-sep{width:12px;height:12px;background:var(--accent2);transform:rotate(45deg);margin:25px auto;box-shadow:0 0 20px var(--accent2);position:relative;border-radius:2px}
.hh .hh-sep::before,.hh .hh-sep::after{content:"";position:absolute;width:160px;height:3px;top:50%;margin-top:-1.5px}
.hh .hh-sep::before{right:25px;transform:rotate(-45deg);background:linear-gradient(to left,var(--accent2),transparent)}
.hh .hh-sep::after{left:25px;transform:rotate(-45deg);background:linear-gradient(to right,var(--accent2),transparent)}
.hh p{color:var(--text2);font-size:15px;letter-spacing:.3px}
.hh-footer{text-align:center;padding:28px 0 10px;color:var(--text3);font-size:12px;display:flex;align-items:center;gap:8px;justify-content:center}
.hh-footer::before,.hh-footer::after{content:'';flex:1;max-width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--border2))}
.profile-notice{text-align:center;padding:40px 20px;color:var(--text3)}
.profile-notice h2{font-size:22px;margin-bottom:8px;font-family:'Rajdhani',sans-serif;color:var(--text2)}
.tlg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
.tlc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:.2s;position:relative}
.tlc:hover{border-color:var(--border2);background:var(--bg3);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.tlc h3{font-size:16px;font-weight:600;font-family:'Rajdhani',sans-serif;margin-bottom:4px}
.tlc .meta{font-size:10px;color:var(--text3);display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.tlca{position:absolute;top:10px;right:10px;display:flex;gap:3px;opacity:0;transition:.15s}
.tlc:hover .tlca{opacity:1}
.nc{border:2px dashed var(--border);background:none;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;min-height:110px;border-radius:10px;cursor:pointer;color:var(--text3);transition:.2s}
.nc:hover{border-color:var(--accent);color:var(--accent2);background:var(--accentbg)}
.nc .plus{font-size:30px;font-weight:300}

/* EDITOR */
.etbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.etitle{font-size:22px;font-weight:700;cursor:pointer;font-family:'Rajdhani',sans-serif;padding:2px 4px;border-bottom:2px solid transparent;transition:.15s}
.etitle:hover{border-bottom-color:var(--accent2)}
.etitle input{background:none;border:none;border-bottom:2px solid var(--accent);font-size:22px;font-weight:700;font-family:'Rajdhani',sans-serif;color:var(--text);outline:none;padding:0;min-width:180px}
.eacts{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.unsaved-badge{font-size:10px;color:var(--gold);display:flex;align-items:center;gap:3px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.saved-badge{font-size:10px;color:var(--green);opacity:0;transition:opacity .4s;display:flex;align-items:center;gap:3px}

/* TIERS */
.twrap{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.trow{display:flex;min-height:172px;border:1px solid var(--border);border-radius:10px;overflow:visible;transition:.2s;position:relative;background:var(--bg2)}
.trow.dov{border-color:var(--accent);box-shadow:0 0 0 3px #7c5cbf33}
.tlbl{width:120px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;color:#fff;position:relative;padding:10px;text-align:center;cursor:default;border-radius:9px 0 0 9px}
.tlbl-txt{font-size:13px;line-height:1.2;word-break:break-word;overflow-wrap:anywhere;text-align:center;pointer-events:none}
.tlbl:hover .topts{opacity:1}
.topts{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:rgba(0,0,0,.62);opacity:0;transition:.15s;border-radius:9px 0 0 9px}
.topts button{width:26px;height:19px;border-radius:3px;background:rgba(255,255,255,.15);font-size:10px;display:flex;align-items:center;justify-content:center}
.topts button:hover{background:rgba(255,255,255,.35)}

/* CHARS - SMOOTH DRAG ANIMATIONS */
.tchars{flex:1;display:flex;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:4px;padding:6px;min-height:172px;position:relative}
.tc,.pc{border-radius:10px;overflow:visible;cursor:grab;position:relative;flex-shrink:0;border:2px solid transparent; background: var(--bg3);
  transition:transform .3s cubic-bezier(0.2, 0, 0.2, 1), border-color .15s, box-shadow .2s, opacity .2s}
.tc{width:100px;height:160px}
.pc{width:102px;height:162px;border-color:var(--border)}
.tc:hover{border-color:var(--accent2);transform:scale(1.1) translateY(-3px) rotate(1deg);z-index:20;box-shadow:0 10px 24px rgba(0,0,0,.55)}
.pc:hover{border-color:var(--accent2);transform:scale(1.08) translateY(-2px);z-index:20;box-shadow:0 8px 20px rgba(0,0,0,.5)}

.del-btn{position:absolute;top:1px;right:1px;background:rgba(224,85,84,.85);color:#fff;border:none;border-radius:3px;width:14px;height:14px;font-size:9px;display:none;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1;z-index:10}
.tc:hover .del-btn,.pc:hover .del-btn{display:flex!important}

/* DRAGGING STATE - wobble */
.tc.is-dragging,.pc.is-dragging{width:0!important;height:0!important;margin:0!important;padding:0!important;border:none!important;opacity:0!important;pointer-events:none!important;position:absolute!important}
.drag-float{position:fixed;pointer-events:none;z-index:9999;width:102px;height:162px;border-radius:10px;overflow:hidden;border:2px solid var(--accent2);box-shadow:0 20px 60px rgba(124,92,191,.7);
  background:#000;will-change:transform,left,top;transition:none !important}
.drag-float img{width:100%;height:100%;object-fit:cover;object-position:center 10%;display:block;pointer-events:none}

/* SLOTS - push apart effect */
.drop-indicator{width:4px;height:140px;background:var(--accent2);border-radius:2px;flex-shrink:0;animation:blink .5s ease-in-out infinite alternate;box-shadow:0 0 8px var(--accent2)}
@keyframes blink{from{opacity:.5;transform:scaleY(.9)}to{opacity:1;transform:scaleY(1)}}

.drop-placeholder{width:100px;height:160px;border-radius:10px;background:var(--accentbg);border:2px dashed var(--accent2);flex-shrink:0;pointer-events:none}

.tc img,.pc img{width:100%;height:100%;object-fit:cover;object-position:center 10%;display:block;pointer-events:none; border-radius:8px;}
.tc .cn,.pc .cn{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.88);font-size:7px;padding:2px 2px;text-align:center;line-height:1.2;opacity:0;transition:.12s;color:#fff;pointer-events:none}
.tc:hover .cn,.pc:hover .cn{opacity:1}

/* POOL */
.addtbtn{background:var(--bg3);border:1px dashed var(--border);border-radius:5px;padding:8px;text-align:center;cursor:pointer;color:var(--text3);font-size:12px;transition:.15s}
.addtbtn:hover{border-color:var(--accent);color:var(--accent2);background:var(--accentbg)}
.pool{background:var(--bg2);border:1px solid var(--border);border-radius:10px;margin-top:8px}
.pool-hdr{padding:10px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pool-hdr h3{font-size:14px;font-weight:600;font-family:'Rajdhani',sans-serif}
.pool-sort-wrap{display:flex;align-items:center;gap:4px;margin-left:auto}
.pool-sort-sel{background:var(--bg3);color:var(--text1);border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:11px;cursor:pointer;outline:none}
.pool-sort-sel:hover{border-color:var(--accent)}
.pool-sort-dir{background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:6px;width:26px;height:26px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.pool-sort-dir:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.sw{position:relative;flex:1;min-width:150px}
.sw input{width:100%;padding-left:28px}
.sw::before{content:"⌕";position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;font-size:16px}
.pchars{display:flex;flex-wrap:wrap;gap:4px;padding:10px;min-height:90px}
.pempty{color:var(--text3);font-size:12px;padding:18px;text-align:center;width:100%}
.load-more{width:100%;padding:10px;text-align:center;cursor:pointer;color:var(--accent2);font-size:12px;font-weight:500;transition:.15s;border-top:1px solid var(--border);margin-top:4px}
.load-more:hover{background:var(--accentbg)}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:22px;width:90%;max-width:500px;max-height:90vh;overflow-y:auto;animation:slideUp .2s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideUp{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal h2{font-size:19px;font-weight:700;margin-bottom:16px;font-family:'Rajdhani',sans-serif}
.fg{margin-bottom:13px}
.fg label{display:block;font-size:10px;color:var(--text2);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg select{width:100%}
.crow{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.csw{width:28px;height:28px;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:.15s}
.csw.sel,.csw:hover{border-color:#fff;transform:scale(1.2)}
.uarea{border:2px dashed var(--border);border-radius:8px;padding:22px;text-align:center;cursor:pointer;color:var(--text3);font-size:12px;transition:.15s;position:relative;overflow:hidden}
.uarea:hover{border-color:var(--accent);color:var(--accent2);background:var(--accentbg)}
.uarea input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.upreview{width:100%;max-height:160px;object-fit:contain;border-radius:6px;margin-top:8px;display:none}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;max-height:200px;overflow-y:auto;z-index:600;margin-top:2px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.ac-item{padding:8px 12px;cursor:pointer;font-size:12px;transition:.12s;display:flex;align-items:center;gap:8px}
.ac-item:hover,.ac-item.focused{background:var(--bg4);color:var(--accent2)}
.ac-item img{width:28px;height:36px;object-fit:cover;border-radius:3px;flex-shrink:0}
.ac-item-info{flex:1;min-width:0}
.ac-item-title{font-weight:500;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-item-sub{font-size:10px;color:var(--text3)}
.char-edit-preview{width:80px;height:100px;object-fit:cover;border-radius:6px;border:2px solid var(--border2)}
.tw{position:fixed;bottom:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:5px}
.toast{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:9px 14px;font-size:12px;animation:si .2s ease;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:320px}
.toast.ok{border-left:3px solid var(--green)}.toast.err{border-left:3px solid var(--red)}.toast.info{border-left:3px solid var(--accent2)}
@keyframes si{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:500;background:var(--accentbg);color:var(--accent2)}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.confirm-bar{background:var(--bg3);border:1px solid var(--gold);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px}
.confirm-bar span{flex:1;color:var(--gold)}

/* MENU HOME */
.menu-grid{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:44px}
.menu-box{width:240px;height:320px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:.3s cubic-bezier(.25,.8,.25,1);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 15px rgba(124,92,191,0.1)}
.menu-box::before{content:'';position:absolute;inset:0;background-image:var(--card-bg);background-size:cover;background-position:center;opacity:.6;transition:.3s;filter:blur(2px);transform:scale(1.05)}
.menu-box::after{content:'';position:absolute;inset:0;background:var(--card-gradient);opacity:.7}
.menu-box:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 24px 60px rgba(0,0,0,0.6),0 0 30px rgba(124,92,191,0.3);border-color:rgba(255,255,255,.18)}
.menu-box:hover::before{opacity:.32}
.menu-box .mb-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:18px}
.menu-box .mb-icon{width:56px;height:56px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.menu-box .mb-icon svg{width:28px;height:28px;stroke:rgba(255,255,255,.9);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-box h2{font-size:22px;font-weight:600;font-family:'Cinzel',serif;color:#fff;letter-spacing:.5px}
.menu-box .mb-sep{width:20px;height:2px;border-radius:2px;background:rgba(255,255,255,.4)}
.mb-tierlists{--card-bg:url('resources/tierlistlogo.png');--card-gradient:linear-gradient(160deg,rgba(140,30,80,.9) 0%,rgba(80,20,120,.9) 100%)}
.mb-users{--card-bg:url('resources/userslogo.png');--card-gradient:linear-gradient(160deg,rgba(70,30,130,.9) 0%,rgba(40,20,100,.9) 100%)}
.mb-profile{--card-bg:url('resources/profilelogo.png');--card-gradient:linear-gradient(160deg,rgba(20,30,90,.9) 0%,rgba(15,25,70,.9) 100%)}
</style>
<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"></div>

async function fetchGlobalTemplates() {
  let allTemplates = [];
  let from = 0;
  const step = 1000;
  while (true) {
    const { data: templates, error } = await sbClient.from('tierlists').select('*').range(from, from + step - 1);
    if (error || !templates || templates.length === 0) break;
    allTemplates = allTemplates.concat(templates);
    if (templates.length < step) break;
    from += step;
  }
  if (!allTemplates.length) return;
  const p = activeProfile();
  if (!p) return;

  const remoteIds = new Set(allTemplates.map(t => t.id));

  allTemplates.forEach(t => {
    // Si dupTL está en curso para este ID, no tocar — lo añadirá él mismo al terminar
    if (S._dupInProgress === t.id) return;

    const localIdx = p.tls.findIndex(local => local.id === t.id);
    const tlData = {
      ...t,
      tiers: t.tiers_config,
      isRemoteTemplate: true,
      updatedAt: new Date(t.updated_at || t.created_at).getTime()
    };
    if (localIdx === -1) {
      p.tls.push(tlData);
    } else {
      // Sincronizar metadatos desde la nube (no sobreescribir pool/customChars locales)
      p.tls[localIdx].title     = t.title;
      p.tls[localIdx].tiers     = t.tiers_config;
      p.tls[localIdx].folder    = t.folder;
      p.tls[localIdx].updatedAt = tlData.updatedAt;
      p.tls[localIdx].isRemoteTemplate = true;
    }
  });

  // 2. Eliminar del local las que ya NO existen en Supabase
  // (alguien las borró desde otra cuenta)
  const before = p.tls.length;
  p.tls = p.tls.filter(tl => {
    // Mantener siempre tierlists que son creación local pura (sin id en Supabase)
    // Una tierlist "local pura" nunca debería existir en este flujo (todas se suben),
    // pero por seguridad: si no tiene isRemoteTemplate Y no está en remoteIds, la dejamos.
    if (!tl.isRemoteTemplate && !remoteIds.has(tl.id)) return true;
    // Si está marcada como remota pero ya no existe en Supabase → eliminar
    return remoteIds.has(tl.id);
  });

  saveProfiles();
  render();
}

async function syncFromSupabase() {
  if (!userSession || !S.cid || !S.workingTL) return;
  
  // 0. Sincronización Universal de Estructura: Refrescar niveles, nombres y colores desde la nube
  const { data: tlMeta } = await sbClient.from('tierlists').select('title, folder, tiers_config').eq('id', S.cid).maybeSingle();
  if (tlMeta) {
    S.workingTL.title = tlMeta.title;
    S.workingTL.folder = tlMeta.folder;
    // Reconstruimos la lista de niveles para que coincida con la nube, inicializando chars vacíos
    S.workingTL.tiers = tlMeta.tiers_config.map(tc => ({ ...tc, chars: [] }));
  }

  // Catálogo dinámico para esta tierlist
  AC = JSON.parse(JSON.stringify(AC_BASE));
  const sharedIds = new Set();
  Object.keys(AC_BASE).forEach(id => sharedIds.add(id));

  // 1. Cargar TODOS los personajes compartidos (Paginado para evitar límite de 1000)
  let allChars = [];
  let from = 0;
  const step = 1000;
  while (true) {
    const { data, error } = await sbClient
      .from('characters')
      .select('*')
      .eq('tierlist_id', S.cid)
      .range(from, from + step - 1);
    if (error || !data || data.length === 0) break;
    allChars = allChars.concat(data);
    if (data.length < step) break;
    from += step;
  }

  allChars.forEach(c => {
    AC[c.id] = { id: c.id, name: c.name, anime: c.anime, file: c.image_url, isRemote: true };
    sharedIds.add(c.id);
  });
  // Catálogo base integrado globalmente

  // 3. Cargar el ranking personal del usuario (donde ha puesto cada uno)
  const { data: myRank } = await sbClient.from('user_rankings').select('*').eq('user_id', userSession.user.id).eq('tierlist_id', S.cid).maybeSingle();
  
  if (S.workingTL) {
    const placedIds = new Set();
    if (myRank) {
      // Sincronización Universal: Si el ranking tiene estructura propia (niveles añadidos/renombrados), la usamos
      if (myRank.tiers_data && myRank.tiers_data.length > 0 && myRank.tiers_data[0].label) {
        S.workingTL.tiers = myRank.tiers_data;
      } else {
        // Fallback para rankings antiguos: solo rellenar personajes en niveles existentes
        myRank.tiers_data.forEach(rd => {
          const t = S.workingTL.tiers.find(x => x.id === rd.id);
          if (t) t.chars = rd.chars;
        });
      }
      // Registrar qué personajes ya están ubicados
      S.workingTL.tiers.forEach(t => (t.chars || []).forEach(id => placedIds.add(id)));
    }

    // 4. EL POOL COMPARTIDO DINÁMICO:
    // La pool son todos los personajes conocidos (sharedIds) que el usuario NO ha puesto en un tier (placedIds)
    S.workingTL.pool = Array.from(sharedIds).filter(id => !placedIds.has(id));
    
    // Ordenamos para que los últimos añadidos por la comunidad salgan primero
    S.workingTL.pool.reverse(); 

    render();
  }
}

// ============ ANILIST SEARCH ============
async function searchAniList(query){
  if(!query||query.length<2)return[];
  const q=`query($s:String){Page(perPage:12){media(search:$s,type:ANIME){id title{romaji english native}coverImage{medium}startDate{year}}}}`;
  try{
    const r=await fetch('https://graphql.anilist.co',{method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({query:q,variables:{s:query}})});
    const d=await r.json();
    return(d.data?.Page?.media||[]).map(m=>({
      id:m.id,
      title:m.title.romaji||m.title.english||m.title.native||'',
      english:m.title.english||'',
      native:m.title.native||'',
      cover:m.coverImage?.medium||'',
      year:m.startDate?.year||''
    }));
  }catch(e){return[];}
}

// Resolve alias
function resolveAlias(q){
  const low=q.toLowerCase().trim();
  if(ALIASES[low])return ALIASES[low];
  // partial alias match
  for(const[k,v]of Object.entries(ALIASES)){if(low.includes(k)||k.includes(low))return v;}
  return q;
}

// ============ H HELPER ============
function h(tag,a,...ch){
  const el=document.createElement(tag);
  for(const[k,v]of Object.entries(a||{})){
    if(k==='style'&&typeof v==='object')Object.assign(el.style,v);
    else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='class')el.className=v;
    else if(k==='html')el.innerHTML=v;
    else el.setAttribute(k,v);
  }
  for(const c of ch.flat()){if(c==null||c===false)continue;el.appendChild(typeof c==='string'?document.createTextNode(c):c);}
  return el;
}

// ============ DRAG (smooth floating image) ============
let DG=null,DS=null,DGidx=-1,dragFloatEl=null;
let scrollDir=0,scrollInt=null;
let _md=false,_mdMoved=false,_mdX=0,_mdY=0,_mdImg='',_lastZoneKey='';

function updateScroll(){if(scrollDir!==0)window.scrollBy(0,scrollDir*60);}
function createFloat(imgSrc){
  removeFloat();
  dragFloatEl=document.createElement('div');
  dragFloatEl.className='drag-float';
  const im=document.createElement('img');im.src=imgSrc;
  dragFloatEl.appendChild(im);document.body.appendChild(dragFloatEl);
}
function removeFloat(){
  if(dragFloatEl){dragFloatEl.remove();dragFloatEl=null;}
  if(scrollInt){clearInterval(scrollInt);scrollInt=null;}
  scrollDir=0;
}
function _posFloat(cx,cy){
  if(!dragFloatEl)return;
  dragFloatEl.style.left=(cx-51)+'px';
  dragFloatEl.style.top=(cy-81)+'px';
  const th=100,wh=window.innerHeight;
  scrollDir=cy<th?-1:cy>wh-th?1:0;
  if(scrollDir&&!scrollInt)scrollInt=setInterval(updateScroll,16);
  else if(!scrollDir&&scrollInt){clearInterval(scrollInt);scrollInt=null;}
}
function _getDropZone(cx,cy){
  if(dragFloatEl)dragFloatEl.style.visibility='hidden';
  const el=document.elementFromPoint(cx,cy);
  if(dragFloatEl)dragFloatEl.style.visibility='';
  if(!el)return null;
  if(el.closest('#pdrop'))return{type:'pool'};
  const trow=el.closest('.trow');
  if(trow){
    const tid=trow.id.replace(/^t/,'');
    const ce=trow.querySelector('.tchars');
    if(!ce)return{type:'tier',tid,idx:0};
    const cards=Array.from(ce.querySelectorAll('.tc:not(.is-dragging)'));
    let idx=cards.length;
    for(let i=0;i<cards.length;i++){
      const r=cards[i].getBoundingClientRect();
      if(cy<r.top){idx=i;break;}
      if(cy<r.bottom&&cx<r.left+r.width/2){idx=i;break;}
    }
    return{type:'tier',tid,idx};
  }
  return null;
}
function _updatePlaceholder(zone){
  // Limpiar highlights
  document.querySelectorAll('.trow.dov').forEach(e=>e.classList.remove('dov'));
  document.getElementById('pdrop')?.classList.remove('dov');
  if(!zone){const ph=document.getElementById('drop-ph');if(ph)ph.remove();return;}
  if(zone.type==='pool'){
    const ph=document.getElementById('drop-ph');if(ph)ph.remove();
    document.getElementById('pdrop')?.classList.add('dov');
    return;
  }
  if(zone.type==='tier'){
    document.getElementById('t'+zone.tid)?.classList.add('dov');
    const ce=document.getElementById('t'+zone.tid)?.querySelector('.tchars');
    if(!ce){const ph=document.getElementById('drop-ph');if(ph)ph.remove();return;}
    const cards=Array.from(ce.querySelectorAll('.tc:not(.is-dragging)'));
    if(DS===zone.tid&&zone.idx===DGidx){const ph=document.getElementById('drop-ph');if(ph)ph.remove();return;}
    // 1. Capturar posiciones ANTES de cualquier cambio DOM
    const allCards=Array.from(ce.querySelectorAll('.tc:not(.is-dragging)'));
    const snapshots=allCards.map(c=>({el:c,rect:c.getBoundingClientRect()}));
    // 2. Quitar placeholder viejo
    const oldph=document.getElementById('drop-ph');if(oldph)oldph.remove();
    // 3. Insertar nuevo placeholder
    const newph=document.createElement('div');
    newph.id='drop-ph';newph.className='drop-placeholder';
    const freshCards=Array.from(ce.querySelectorAll('.tc:not(.is-dragging)'));
    if(zone.idx>=freshCards.length)ce.appendChild(newph);
    else ce.insertBefore(newph,freshCards[zone.idx]);
    // 4. FLIP: animar solo las cartas que se movieron
    snapshots.forEach(({el,rect:oldRect})=>{
      const newRect=el.getBoundingClientRect();
      const dx=oldRect.left-newRect.left,dy=oldRect.top-newRect.top;
      if(dx||dy){
        el.style.transition='none';
        el.style.transform=`translate(${dx}px,${dy}px)`;
        el.offsetHeight;
        el.style.transition='';
        el.style.transform='';
      }
    });
  }
}
function _executeDrop(zone){
  if(!zone||!DG)return;
  const tl=S.workingTL;
  if(zone.type==='pool'){
    if(DS==='pool')return;
    const s=tl.tiers.find(t=>t.id===DS);
    if(s)s.chars=s.chars.filter(x=>x!==DG);
    if(!tl.pool.includes(DG))tl.pool.push(DG);
    markUnsaved();
  }else if(zone.type==='tier'){
    if(DS==='pool')tl.pool=tl.pool.filter(x=>x!==DG);
    else{const s=tl.tiers.find(t=>t.id===DS);if(s)s.chars=s.chars.filter(x=>x!==DG);}
    const dest=tl.tiers.find(t=>t.id===zone.tid);
    if(dest){
      dest.chars=dest.chars.filter(x=>x!==DG);
      if(typeof zone.idx==='number'&&zone.idx>=0)dest.chars.splice(zone.idx,0,DG);
      else dest.chars.push(DG);
    }
    markUnsaved();
  }
}
function _dragCleanup(){
  document.body.style.userSelect='';
  DG=null;DS=null;DGidx=-1;_md=false;_mdMoved=false;_lastZoneKey='';
  removeFloat();lastZone=null;
  const ph=document.getElementById('drop-ph');if(ph)ph.remove();
  document.querySelectorAll('.is-dragging').forEach(el=>el.classList.remove('is-dragging'));
  document.querySelectorAll('.tc').forEach(el=>el.style.transform='');
  document.querySelectorAll('.dov').forEach(el=>el.classList.remove('dov'));
}

document.addEventListener('mousemove',e=>{
  if(!_md)return;
  if(!_mdMoved){
    if(Math.sqrt((e.clientX-_mdX)**2+(e.clientY-_mdY)**2)<5)return;
    _mdMoved=true;
    document.body.style.userSelect='none';
    createFloat(_mdImg);
    _posFloat(e.clientX,e.clientY);
    document.querySelectorAll('.tc,.pc').forEach(el=>{
      if(el.dataset.cid===DG)el.classList.add('is-dragging');
    });
  }
  _posFloat(e.clientX,e.clientY);
  const zone=_getDropZone(e.clientX,e.clientY);
  const key=zone?(zone.type+(zone.tid||'')+(zone.idx??'')):'';
  if(key!==_lastZoneKey){_lastZoneKey=key;_updatePlaceholder(zone);}
},{passive:true});

document.addEventListener('mouseup',e=>{
  if(!_md)return;
  if(!_mdMoved){_dragCleanup();return;}
  const zone=_getDropZone(e.clientX,e.clientY);
  _executeDrop(zone);
  _dragCleanup();
},{passive:true});

function dgPointerDown(e,id,src,idx,imgSrc){
  if(e.button!==0)return;
  DG=id;DS=src;DGidx=idx;
  _md=true;_mdMoved=false;
  _mdX=e.clientX;_mdY=e.clientY;
  _mdImg=imgSrc||'';
}

  e.preventDefault();if(!DG)return;

  const dest=tl.tiers.find(t=>t.id===tid);
  if(dest){
    dest.chars=dest.chars.filter(x=>x!==DG);
    if(typeof toIdx==='number'&&toIdx>=0)dest.chars.splice(toIdx,0,DG);
    else dest.chars.push(DG);
  }
  markUnsaved();
}

  tb.appendChild(ea);w.appendChild(tb);
  // Tiers
  const tw=h('div',{class:'twrap'});
  (tl.tiers||[]).forEach((tier,ti)=>{
    const row=h('div',{class:'trow',id:'t'+tier.id});
    row.ondragover=e=>{e.preventDefault();document.querySelectorAll('.trow.dov').forEach(el=>el.classList.remove('dov'));row.classList.add('dov');};
    row.ondragleave=e=>{if(!row.contains(e.relatedTarget))row.classList.remove('dov');};
    row.ondrop=e=>tdrop(e,tier.id);
    const lbl=h('div',{class:'tlbl',style:{background:tier.color||'#888'}});
    lbl.appendChild(h('div',{class:'tlbl-txt'},tier.label||'?'));
    const oo=h('div',{class:'topts'});
    oo.appendChild(h('button',{title:'Renombrar',onclick:()=>{const n=prompt('Nuevo nombre (máx 25 caracteres):',tier.label);if(n!==null&&n.trim()){tier.label=n.trim().slice(0,25);markUnsaved();}}},'✏'));
    oo.appendChild(h('button',{title:'Color',onclick:()=>{S.modal='color';S.md={tier};render();}},'??'));
    oo.appendChild(h('button',{title:'Subir',onclick:()=>{if(ti>0){[tl.tiers[ti],tl.tiers[ti-1]]=[tl.tiers[ti-1],tl.tiers[ti]];markUnsaved();}}},'▲'));
    oo.appendChild(h('button',{title:'Bajar',onclick:()=>{if(ti<tl.tiers.length-1){[tl.tiers[ti],tl.tiers[ti+1]]=[tl.tiers[ti+1],tl.tiers[ti]];markUnsaved();}}},'▼'));
    oo.appendChild(h('button',{title:'Eliminar',style:{color:'var(--red)'},onclick:()=>{if(confirm('\xBFEliminar tier?')){tl.pool=[...tl.pool,...tier.chars];tl.tiers=tl.tiers.filter(t=>t.id!==tier.id);markUnsaved();}}},'✕'));
    lbl.appendChild(oo);
    const ce=h('div',{class:'tchars'});
    ce.ondragover = e => {
      e.preventDefault();
      
      // Capturamos posiciones iniciales para la animación (FLIP)
      const children = Array.from(ce.children);
      const positions = children.map(c => c.getBoundingClientRect());

      const cards = Array.from(ce.querySelectorAll('.tc:not(.is-dragging):not(.drop-placeholder)'));
      let targetIdx = cards.length;

      for(let i=0; i<cards.length; i++){
        const r = cards[i].getBoundingClientRect();
        if (e.clientY < r.top) { targetIdx = i; break; }
        if (e.clientY < r.bottom && e.clientX < r.left + r.width / 2) { targetIdx = i; break; }
      }

      const zone = tier.id + '_' + targetIdx;
      if(lastZone === zone) return;
      lastZone = zone;

      let ph = document.getElementById('drop-ph');
      if(ph) ph.remove();

      if(DS !== tier.id || targetIdx !== DGidx) {
        ph = h('div', {id: 'drop-ph', class: 'drop-placeholder'});
        if(targetIdx >= cards.length) ce.appendChild(ph);
        else ce.insertBefore(ph, cards[targetIdx]);
      }

      // Aplicamos la magia de la animación
      const newChildren = Array.from(ce.children);
      newChildren.forEach(child => {
        if(child.classList.contains('is-dragging')) return;
        const oldIdx = children.indexOf(child);
        if(oldIdx === -1) return; // Es el nuevo placeholder
        
        const oldRect = positions[oldIdx];
        const newRect = child.getBoundingClientRect();
        
        const dx = oldRect.left - newRect.left;
        const dy = oldRect.top - newRect.top;
        
        if(dx !== 0 || dy !== 0) {
          child.style.transition = 'none';
          child.style.transform = `translate(${dx}px, ${dy}px)`;
          child.offsetHeight; // Forzamos reflow
          child.style.transition = ''; // Restauramos la transición del CSS
          child.style.transform = '';
        }
      });
    };
    ce.ondragleave = e => { 
      if(!ce.contains(e.relatedTarget)) { 
        const ph=document.getElementById('drop-ph'); if(ph) ph.remove(); 
        lastZone=null; 
      } 
    };
    ce.ondrop = e => {
      e.preventDefault(); e.stopPropagation();
      if(!DG) return;
      const ph = document.getElementById('drop-ph');
      // Obtenemos el índice del placeholder ignorando la carta que estamos arrastrando
      let dropIdx = ph && ph.parentNode === ce ? Array.from(ce.children).filter(x=>!x.classList.contains('is-dragging')).indexOf(ph) : -1;
      if(ph) ph.remove();
      if(dropIdx === -1) {
        // Fallback por si el drop ocurre fuera del área del placeholder
        const cards = Array.from(ce.querySelectorAll('.tc:not(.is-dragging)'));
        dropIdx = cards.length;
        for(let i=0; i<cards.length; i++){
          const r = cards[i].getBoundingClientRect();
          if (e.clientY < r.top) { dropIdx = i; break; }
          if (e.clientY < r.bottom && e.clientX < r.left + r.width / 2) { dropIdx = i; break; }
        }
      }
      tdrop(e, tier.id, dropIdx);
    };

    (tier.chars||[]).forEach((cid,ci)=>{
      const c=getChar(cid,tl);if(!c)return;
      const el=h('div',{class:'tc',style:{position:'relative'}});
      el.dataset.cid=cid;
      el.title=(c.name||cid)+' \u2014 '+(c.anime||'');
      const imgSrcVal=charImg(cid,tl);
      el.appendChild(h('img',{src:imgSrcVal,onerror:(e)=>e.target.src='https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(c.name||cid)}));
      el.appendChild(h('div',{class:'cn'},c.name||cid));
      el.appendChild(h('button',{class:'del-btn',title:'Eliminar permanentemente',onclick:(e)=>{e.stopPropagation();deleteCustomChar(cid,tl);}},'✕'));
      el.addEventListener('mousedown',e=>dgPointerDown(e,cid,tier.id,ci,imgSrcVal));
      el.ondblclick=()=>{tier.chars=tier.chars.filter(x=>x!==cid);if(!tl.pool.includes(cid))tl.pool.unshift(cid);markUnsaved();};
      ce.appendChild(el);
    });
    row.appendChild(lbl);row.appendChild(ce);tw.appendChild(row);
  });
  tw.appendChild(h('div',{class:'addtbtn',onclick:()=>addTier(tl)},'＋ A\xf1adir tier'));
  w.appendChild(tw);
  // Pool
  const ps=h('div',{class:'pool',id:'pdrop'});
  ps.ondragover=pover;ps.ondrop=pdrop;
  ps.ondragleave=e=>{if(!ps.contains(e.relatedTarget))ps.classList.remove('dov');};
  const ph=h('div',{class:'pool-hdr'});
  ph.appendChild(h('h3',{},'Pool'));
  ph.appendChild(h('span',{class:'badge'},(tl.pool||[]).length+''));
  const sw=h('div',{class:'sw',style:{flex:'1',minWidth:'150px'}});
  const si=h('input',{type:'text',placeholder:'Buscar...',value:S.q});
  si.oninput=e=>{S.q=e.target.value;S.poolPage=0;updPool(pc,tl);};
  sw.appendChild(si);ph.appendChild(sw);
  // Sort controls
  const sortWrap=h('div',{class:'pool-sort-wrap'});
  const sortSel=h('select',{class:'pool-sort-sel',title:'Ordenar por'});
  [['default','Sin ordenar'],['added','Fecha añadido'],['name','Nombre (A-Z)'],['anime','Anime (A-Z)'],['rating','Rareza/Custom primero']].forEach(([v,lbl])=>{
    const op=h('option',{value:v},lbl);
    if(S.poolSort===v)op.selected=true;
    sortSel.appendChild(op);
  });
  sortSel.onchange=e=>{S.poolSort=e.target.value;S.poolPage=0;updPool(pc,tl);};
  sortWrap.appendChild(sortSel);
  const dirBtn=h('button',{class:'pool-sort-dir',title:'Invertir orden',onclick:()=>{S.poolSortDir=S.poolSortDir==='asc'?'desc':'asc';S.poolPage=0;updPool(pc,tl);}},S.poolSortDir==='asc'?'↑':'↓');
  sortWrap.appendChild(dirBtn);
  ph.appendChild(sortWrap);
  ps.appendChild(ph);
  const pc=h('div',{class:'pchars'});
  updPool(pc,tl);ps.appendChild(pc);w.appendChild(ps);
  return w;
}

const PAGE=200;
async function deleteCustomChar(cid,tl){
  if(!confirm('¿Eliminar este personaje permanentemente? Se borrará de la cloud si fue subido.'))return;
  // Borrar de Supabase si hay sesión
  if(userSession&&sbClient){
    try{
      const cc=(tl.customChars||[]).find(c=>c.id===cid);
      if(cc&&cc.file&&cc.file.startsWith('http')){
        const marker='/tierlists/';
        const idx=cc.file.indexOf(marker);
        if(idx>=0){
          const path=cc.file.slice(idx+marker.length);
          await sbClient.storage.from('tierlists').remove([path]);
        }
      }
      // Borrar solo de la tabla de personajes de ESTA tierlist
      await sbClient.from('characters').delete().eq('id',cid).eq('tierlist_id',tl.id);
    }catch(e){console.error('Error borrando personaje de Supabase:',e);}
  }
  // Quitar de local
  tl.customChars=(tl.customChars||[]).filter(c=>c.id!==cid);
  tl.pool=(tl.pool||[]).filter(x=>x!==cid);
  tl.tiers.forEach(t=>{t.chars=(t.chars||[]).filter(x=>x!==cid);});
  S.hasUnsaved=true;
  const cont=document.querySelector('.pchars');
  if(cont)updPool(cont,tl);
  else render();
  toast('Personaje eliminado');
}

function updPool(cont,tl){
  // Sync direction button text
  const dirBtnEl=document.querySelector('.pool-sort-dir');
  if(dirBtnEl)dirBtnEl.textContent=S.poolSortDir==='asc'?'↑':'↓';
  cont.innerHTML='';
  let chars=tl.pool||[];
  if(S.q){const q=S.q.toLowerCase();chars=chars.filter(cid=>{const c=getChar(cid,tl);return c&&((c.name||'').toLowerCase().includes(q)||(c.anime||'').toLowerCase().includes(q));});}
  // Sorting
  if(S.poolSort&&S.poolSort!=='default'){
    const dir=S.poolSortDir==='desc'?-1:1;
    chars=[...chars].sort((a,b)=>{
      const ca=getChar(a,tl),cb=getChar(b,tl);
      if(!ca&&!cb)return 0;if(!ca)return 1;if(!cb)return -1;
      if(S.poolSort==='added'){
        const da=ca.added_at?new Date(ca.added_at).getTime():null;
        const db2=cb.added_at?new Date(cb.added_at).getTime():null;
        // Sin fecha van al final siempre (independiente del dir)
        if(da===null&&db2===null)return 0;
        if(da===null)return 1;
        if(db2===null)return -1;
        return (da-db2)*dir;
      }
      if(S.poolSort==='name'){
        return (ca.name||'').localeCompare(cb.name||'','es',{sensitivity:'base'})*dir;
      }
      if(S.poolSort==='anime'){
        const cmp=(ca.anime||'').localeCompare(cb.anime||'','es',{sensitivity:'base'});
        if(cmp!==0)return cmp*dir;
        return (ca.name||'').localeCompare(cb.name||'','es',{sensitivity:'base'})*dir;
      }
      if(S.poolSort==='rating'){
        // Custom primero, luego resto
        const ac=ca.isCustom?0:1,bc2=cb.isCustom?0:1;
        if(ac!==bc2)return (ac-bc2)*dir;
        return (ca.name||'').localeCompare(cb.name||'','es',{sensitivity:'base'});
      }
      return 0;
    });
  }
  if(!chars.length){cont.appendChild(h('div',{class:'pempty'},S.q?'Sin resultados':'Pool vacío'));return;}
  const shown=chars.slice(0,(S.poolPage+1)*PAGE);
  shown.forEach(cid=>{
    const c=getChar(cid,tl);if(!c)return;
    const el=h('div',{class:'pc',style:{position:'relative'}});el.dataset.cid=cid;
    el.title=(c.name||cid)+' \u2014 '+(c.anime||'');
    const im=h('img',{src:charImg(cid,tl),alt:c.name||cid,loading:'lazy'});
    im.onerror=()=>{im.src='https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(c.name||cid)+'&size=66';};
    el.appendChild(im);el.appendChild(h('div',{class:'cn'},c.name||cid));
    el.appendChild(h('button',{class:'del-btn',title:'Eliminar permanentemente',onclick:(e)=>{e.stopPropagation();deleteCustomChar(cid,tl);}},'✕'));
    const imgSrcVal=charImg(cid,tl);
    el.addEventListener('mousedown',e=>dgPointerDown(e,cid,'pool',-1,imgSrcVal));
    cont.appendChild(el);
  });
  if(shown.length<chars.length){
    cont.appendChild(h('div',{class:'load-more',onclick:()=>{S.poolPage++;updPool(cont,tl);}},
      `Ver más \u2014 ${shown.length}/${chars.length}`));
  }
}

// ============ EXPORT PNG ============
function expPNG(){
  const tl=S.workingTL;if(!tl)return;
  const TH=172,LW=120,W=1600;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=52+(TH+3)*tl.tiers.length;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#12121a';ctx.fillRect(0,0,W,canvas.height);
  ctx.fillStyle='#e8e8f0';ctx.font='bold 22px sans-serif';ctx.textBaseline='middle';
  ctx.fillText(tl.title||'Tierlist',LW+10,26);
  const draw=async()=>{
    for(let i=0;i<tl.tiers.length;i++){
      const tier=tl.tiers[i];const y=50+(TH+3)*i;
      ctx.fillStyle=tier.color||'#888';ctx.fillRect(0,y,LW,TH);
      ctx.fillStyle='#fff';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(tier.label||'?',LW/2,y+TH/2);ctx.textAlign='left';
      ctx.fillStyle='#1a1a26';ctx.fillRect(LW,y,W-LW,TH);
      ctx.strokeStyle='#2a2a45';ctx.lineWidth=1;ctx.strokeRect(0,y,W,TH);
      let cx=LW+4;
      for(const cid of tier.chars){
        const src=charImg(cid,tl);if(!src||cx+98>W)break;
        await new Promise(res=>{
          const im=new Image();im.crossOrigin='anonymous';
          im.onload=()=>{ctx.drawImage(im,cx,y+6,96,160);res();};
          im.onerror=()=>{
            const c=getChar(cid,tl);ctx.fillStyle='#2a2a45';ctx.fillRect(cx,y+6,96,160);
            ctx.fillStyle='#9090b0';ctx.font='7px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText((c&&c.name||'?').slice(0,10),cx+48,y+86);ctx.textAlign='left';res();
          };im.src=src;
        });cx+=102;
      }
    }
    ctx.fillStyle='#3a3a60';ctx.font='11px sans-serif';ctx.textBaseline='bottom';
    ctx.fillText('AnimeTier \u2014 '+tl.title,8,canvas.height-4);
    const a=document.createElement('a');a.href=canvas.toDataURL('image/png');
    a.download=(tl.title||'tierlist').replace(/[^a-z0-9]/gi,'_')+'.png';a.click();toast('PNG exportado \u2713');
  };draw();
}

// Borrar recursivamente todos los archivos de una carpeta del bucket 'tierlists'
// Extrae el path relativo al bucket desde una image_url completa
function extractBucketPath(url) {
  if (!url) return null;
  const marker = '/tierlists/';
  const idx = url.indexOf(marker);
  return idx >= 0 ? url.slice(idx + marker.length) : null;
}

// Borra todos los archivos del bucket asociados a una tierlist
// Estrategia: usar las URLs de la tabla characters (no depende de list() con RLS)
// + un list() final de limpieza para lo que quede (ej: .emptyKeep, placeholders)
async function deleteBucketFolder(bucketFolder, tierlistId) {
  const paths = new Set();

  // 1. Recoger paths desde la tabla characters (funciona aunque list() esté bloqueado por RLS)
  if (tierlistId && sbClient) {
    let from = 0;
    const step = 1000;
    while (true) {
      const { data: chars, error } = await sbClient.from('characters')
        .select('image_url')
        .eq('tierlist_id', tierlistId)
        .range(from, from + step - 1);
      if (error || !chars || chars.length === 0) break;
      chars.forEach(c => {
        const p = extractBucketPath(c.image_url);
        if (p) paths.add(p);
      });
      if (chars.length < step) break;
      from += step;
    }
  }

  // 2. Intentar list() también (funciona si RLS lo permite, o si el bucket es público)
  try {
    let offset = 0;
    while (true) {
      const { data: items } = await sbClient.storage.from('tierlists').list(bucketFolder, { limit: 1000, offset });
      if (!items || items.length === 0) break;
      items.forEach(item => {
        if (item.id !== null && item.metadata !== null) {
          paths.add(`${bucketFolder}/${item.name}`);
        }
      });
      if (items.length < 1000) break;
      offset += items.length;
    }
  } catch(_) {}

  // Añadir placeholders típicos de Supabase Storage
  paths.add(`${bucketFolder}/.emptyKeep`);
  paths.add(`${bucketFolder}/.folder`);
  paths.add(`${bucketFolder}/.gitkeep`);

  // 3. Borrar todo en lotes de 100 (límite de Supabase por llamada a remove)
  const allPaths = [...paths];
  const totalDel = allPaths.length;
  let doneDel = 0;
  const BATCH = 100;
  for (let i = 0; i < allPaths.length; i += BATCH) {
    const batch = allPaths.slice(i, i + BATCH);
    try {
      await sbClient.storage.from('tierlists').remove(batch);
    } catch(e) { console.warn('Error en lote remove:', e.message); }
    doneDel += batch.length;
    if (totalDel > 0) toast(`Borrando archivos... ${doneDel}/${totalDel}`, 'info');
  }
}

    return;
  }

  toast('Eliminando...','info');

  try{
    const folder = (tl && tl.folder) ? tl.folder : sanFolder(tl ? tl.title : id);

    // 1. Borrar la fila de tierlists en Supabase (primero, para que otros usuarios la vean desaparecer)
    const { error: tlErr } = await sbClient.from('tierlists').delete().eq('id', id);
    if (tlErr) throw new Error('Error borrando tierlist: ' + tlErr.message);

    // 2. Borrar todos los rankings de todos los usuarios para esta tierlist
    await sbClient.from('user_rankings').delete().eq('tierlist_id', id);

    // 3. Borrar personajes de la tabla characters
    await sbClient.from('characters').delete().eq('tierlist_id', id);

    // 4. Borrar carpeta completa del bucket via Edge Function (server-side, sin límites del browser)
    toast('Borrando imágenes del servidor…', 'info');
    const fnRes = await fetch(SB_URL + '/functions/v1/delete-folder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SB_KEY },
      body: JSON.stringify({ folder })
    });
    const fnData = await fnRes.json();
    if (!fnRes.ok) {
      console.warn('Edge Function delete-folder error:', fnData);
      // No es fatal — la tierlist ya fue borrada de la DB
      toast('Tierlist eliminada. Imágenes: ' + (fnData.error || fnRes.status), 'err');
    } else {
      toast('Tierlist eliminada: ' + fnData.deleted + ' imágenes borradas ✓');
    }

    // 5. Eliminar del local de TODOS los perfiles cargados
    S.profiles.forEach(prof => {
      prof.tls = (prof.tls||[]).filter(t => t.id !== id);
    });
    if (S.cid === id) { S.cid=null; S.workingTL=null; S.hasUnsaved=false; setRoute('home'); }
    saveProfiles();
    render();

  }catch(e){
    console.error('Error borrando tierlist:', e);
    toast('Error al eliminar: ' + e.message, 'err');
  }
}
async function dupTL(id){
  const p = activeProfile(); if (!p) return;
  const tl = p.tls.find(t => t.id === id); if (!tl) return;

  let newTitle = "";
  while (true) {
    newTitle = prompt("Nombre para la copia de la tierlist:", "Copia de " + tl.title);
    if (newTitle === null) return;
    newTitle = newTitle.trim();
    if (!newTitle) continue;
    if (p.tls.some(t => t.title.toLowerCase() === newTitle.toLowerCase())) {
      alert("Ya existe una tierlist con ese nombre. Elige otro.");
      continue;
    }
    break;
  }

  const newId   = uid();
  const oldFolder = tl.folder || sanFolder(tl.title) || tl.id;
  const newFolder = sanFolder(newTitle);

  const copy = JSON.parse(JSON.stringify(tl));
  copy.id          = newId;
  copy.title       = newTitle;
  copy.folder      = newFolder;
  copy.isRemoteTemplate = true;
  copy.updatedAt   = Date.now();
  copy.createdAt   = Date.now();

  if (!userSession || !sbClient) {
    p.tls.push(copy); saveProfiles(); render();
    toast("Tierlist duplicada localmente ✓");
    return;
  }

  // Bloquear fetchGlobalTemplates para que no añada la copia antes de que nosotros lo hagamos
  S._dupInProgress = newId;
  toast("Duplicando tierlist…", "info");

  try {
    // ── 1. Crear tierlist en Supabase ────────────────────────────────────────
    const { error: tlErr } = await sbClient.from('tierlists').insert({
      id: newId, title: newTitle, folder: newFolder,
      tiers_config: copy.tiers.map(t => ({ id: t.id, label: t.label, color: t.color })),
      created_by: userSession.user.id
    });
    if (tlErr) throw new Error("Error creando tierlist: " + tlErr.message);

    // ── 2. Clonar personajes (paginado) ──────────────────────────────────────
    let allChars = [], offset = 0;
    while (true) {
      const { data: batch, error: bErr } = await sbClient
        .from('characters').select('*')
        .eq('tierlist_id', id).range(offset, offset + 999);
      if (bErr || !batch || !batch.length) break;
      allChars = allChars.concat(batch);
      if (batch.length < 1000) break;
      offset += 1000;
    }

    const idMap = {};
    if (allChars.length > 0) {
      const newChars = allChars.map(c => {
        const nid = 'c_' + uid();
        idMap[c.id] = nid;
        // IMPORTANTE: la image_url debe apuntar a la nueva carpeta,
        // que es exactamente donde copy-folder va a dejar los archivos
        return {
          ...c, id: nid, tierlist_id: newId, created_by: userSession.user.id,
          image_url: c.image_url
            ? c.image_url.replace('/' + oldFolder + '/', '/' + newFolder + '/')
            : null
        };
      });
      // Insertar en lotes de 500
      for (let i = 0; i < newChars.length; i += 500) {
        const { error: cErr } = await sbClient.from('characters').insert(newChars.slice(i, i + 500));
        if (cErr) throw new Error("Error clonando personajes: " + cErr.message);
      }
      // Actualizar IDs en la copia local
      copy.pool = copy.pool.map(cid => idMap[cid] || cid);
      copy.tiers.forEach(t => { t.chars = t.chars.map(cid => idMap[cid] || cid); });
      if (copy.customChars) copy.customChars.forEach(cc => {
        if (idMap[cc.id]) {
          cc.id = idMap[cc.id];
          if (cc.file) cc.file = cc.file.replace('/' + oldFolder + '/', '/' + newFolder + '/');
        }
      });
    }

    // ── 3. Clonar ranking personal si existe ────────────────────────────────
    const { data: myRank } = await sbClient.from('user_rankings').select('*')
      .eq('user_id', userSession.user.id).eq('tierlist_id', id).maybeSingle();
    if (myRank) {
      await sbClient.from('user_rankings').insert({
        user_id: userSession.user.id, tierlist_id: newId,
        tiers_data: (myRank.tiers_data || []).map(t => ({
          ...t, chars: (t.chars || []).map(cid => idMap[cid] || cid)
        })),
        pool_data: (myRank.pool_data || []).map(cid => idMap[cid] || cid),
        updated_at: new Date().toISOString()
      });
    }

    // ── 4. Copiar imágenes server-side via Edge Function ─────────────────────
    // La función usa service_role → copia directamente en el bucket sin pasar
    // los archivos por el navegador. 2000 imágenes en segundos.
    toast("Copiando imágenes en el servidor…", "info");
    const fnRes = await fetch(SB_URL + '/functions/v1/copy-folder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SB_KEY },
      body: JSON.stringify({ srcFolder: oldFolder, dstFolder: newFolder })
    });
    const fnData = await fnRes.json();
    if (!fnRes.ok) {
      console.warn("Edge Function copy-folder error:", fnData);
      toast("Tierlist clonada (imágenes no copiadas: " + (fnData.error || fnRes.status) + ")", "err");
    } else {
      toast("Imágenes copiadas: " + fnData.copied + " ✓", "info");
    }

    // ── 5. Añadir al perfil local — UNA SOLA VEZ ────────────────────────────
    // Verificar que fetchGlobalTemplates no la haya añadido mientras esperábamos
    if (!p.tls.find(t => t.id === newId)) {
      p.tls.push(copy);
    } else {
      // Ya fue añadida por fetchGlobalTemplates: actualizar con la copia local (tiene pool/ranks)
      const idx = p.tls.findIndex(t => t.id === newId);
      p.tls[idx] = copy;
    }
    saveProfiles();
    render();
    toast("¡Tierlist duplicada con éxito! ✓");

  } catch (e) {
    console.error(e);
    toast("Error en la duplicación: " + e.message, "err");
  } finally {
    S._dupInProgress = null;
  }
}

// ============ ROUTING (hash-based para GitHub Pages) ============
function getRouteFromHash(){
  // Ignorar si el hash es del OAuth de Supabase (contiene access_token)
  if(location.hash.includes('access_token'))return{page:'home',tlId:null};
  const hash=location.hash.replace('#','').replace(/^\//,'');
  if(!hash||hash==='home')return{page:'home',tlId:null};
  // Formato: editor/<id>
  const m=hash.match(/^editor\/(.+)$/);
  if(m)return{page:'editor',tlId:decodeURIComponent(m[1])};
  return{page:'home',tlId:null};
}
function setRoute(page,tlId){
  if(page==='home'){
    history.pushState(null,'',location.pathname+'#home');
    document.title='AnimeTier';
  } else if(page==='editor'&&tlId){
    history.pushState(null,'',location.pathname+'#editor/'+encodeURIComponent(tlId));
    const p=activeProfile();
    const tl=p&&p.tls.find(t=>t.id===tlId);
    if(tl) document.title='AnimeTier – '+tl.title;
  }
}
window.addEventListener('popstate',()=>{
  const{page,tlId}=getRouteFromHash();
  if(page==='editor'&&tlId){
    const p=activeProfile();
    const tl=p&&p.tls.find(t=>t.id===tlId);
    if(tl){S.page='editor';S.cid=tlId;S.workingTL=JSON.parse(JSON.stringify(tl));S.hasUnsaved=false;}
    else{S.page='home';S.cid=null;S.workingTL=null;}
  }else{S.page='home';S.cid=null;S.workingTL=null;}
  render();
});

async function updateProfileField(field, value) {
  if (!userSession || !sbClient) return;
  const { error } = await sbClient.from('profiles').update({ [field]: value }).eq('id', userSession.user.id);
  if (!error) {
    if (currentUserProfile) currentUserProfile[field] = value;
    const localP = activeProfile();
    if (localP) localP[field] = value;
    saveProfiles(); toast("Perfil actualizado"); render();
  }
}

// === GLOBALS SUPABASE ===
let userSession = null;
let currentUserProfile = null;
let isFetchingProfile = false;
let isDeletingAccount = false;

async function handleAuthSession(session) {
  if (isDeletingAccount) return;
  userSession = session;
  // Solo saltamos el fetch si ya tenemos el perfil cargado Y hay sesión activa
  // Si currentUserProfile fue borrado o hay cuenta nueva, siempre re-fetching
  if (isFetchingProfile || (currentUserProfile && currentUserProfile.id === session.user.id && S.activeProfile)) {
    render();
    return;
  }

  isFetchingProfile = true;
  try {
    let { data: profile } = await sbClient.from('profiles').select('*').eq('id', session.user.id).maybeSingle();

    if (!profile) {
      let username = "";
      while (true) {
        username = prompt("¡Bienvenido! Elige un nombre de usuario único (Cualquier otra acción cancelará el inicio de sesión):");
        if (username === null) { 
          await handleLogout(); 
          return; 
        }
        username = username.trim();
        if (!username) continue;
        
        // Comprobación de unicidad en la base de datos
        const { data: taken } = await sbClient.from('profiles').select('name').eq('name', username).maybeSingle();
        if (taken) {
          alert("Este nombre de usuario ya existe. Por favor, elige otro.");
          continue;
        }
        break;
      }
      profile = { id: session.user.id, name: username, color: '#7c5cbf' };
      const { error: insErr } = await sbClient.from('profiles').insert(profile);
      if (insErr) { toast("Error al crear perfil", "err"); await handleLogout(); return; }
    }

    currentUserProfile = profile;
    S.activeProfile = session.user.id;

    if (!S.profiles) S.profiles = [];
    let localP = S.profiles.find(x => x.id === S.activeProfile);
    
    if (!localP) {
      const oldProfiles = JSON.parse(localStorage.getItem('at4_profiles') || localStorage.getItem('at3_profiles') || '[]');
      const oldY = oldProfiles.find(x => x.name === 'Y' || x.id === 'profile_Y');
      localP = { ...profile, tls: oldY ? oldY.tls : [] };
      S.profiles.push(localP);
      if(oldY) toast("¡Tierlist de Waifus migrada con éxito!", "info");
    } else {
      // Sincronizar datos del perfil desde Supabase (is_admin, nombre, etc)
      localP.is_admin = profile.is_admin;
      localP.name = profile.name;
      localP.color = profile.color;
    }

    S.profiles = S.profiles.filter(x => x.id === S.activeProfile);
    saveProfiles();
    fetchGlobalTemplates();
    // Si hay una ruta pendiente (URL con hash al cargar), abrir el editor correspondiente
    if(S._pendingTlId){
      const pendingTl=S.profiles.find(p=>p.id===S.activeProfile)?.tls.find(t=>t.id===S._pendingTlId);
      if(pendingTl){S.cid=S._pendingTlId;S.workingTL=JSON.parse(JSON.stringify(pendingTl));S.hasUnsaved=false;S.page='editor';}
      S._pendingTlId=null;
    }
    if (S.cid) syncFromSupabase();
  } finally {
    isFetchingProfile = false;
    render();
  }
}

async function handleDeleteAccount() {
  if(!confirm('¿Seguro que quieres eliminar tu cuenta? Se borrarán tus rankings personales y tu perfil, pero las tierlists y personajes creados se mantendrán para la comunidad.')) return;
  if(!sbClient || !userSession) return;
  const uid = userSession.user.id;
  isDeletingAccount = true;
  try {
    toast('Desvinculando datos públicos y eliminando cuenta...','info');

    currentUserProfile = null;
    isFetchingProfile = false;

    // 1. Borrar rankings personales (vinculados al usuario)
    await sbClient.from('user_rankings').delete().eq('user_id', uid);

    // 3. Borrar perfil de la tabla public.profiles
    await sbClient.from('profiles').delete().eq('id', uid);

    // 4. Borrar el usuario de Supabase Auth (Pestaña Authentication)
    // Invocamos la función RPC que tiene permisos de administrador
    const { error: authErr } = await sbClient.rpc('delete_user_account');
    if (authErr) console.error("Error en Auth:", authErr);

    // 5. Limpiar localStorage por completo
    localStorage.removeItem('at4_profiles');
    localStorage.removeItem('at4_activeProfile');
    localStorage.removeItem('at4_deleted_tls');

    // 6. Reset de variables y sesión
    userSession = null;
    S.activeProfile = null;
    S.profiles = [];
    S.page = 'home';
    S.cid = null;
    S.workingTL = null;
    S.modal = null;
    history.replaceState(null,'',location.pathname);
    isDeletingAccount = false;
    
    render();
    toast('Cuenta eliminada con éxito.');
    // Recarga forzada para limpiar cualquier estado persistente del SDK de Supabase
    setTimeout(() => location.reload(), 1000);
  } catch(e) {
    isDeletingAccount = false;
    console.error('Error eliminando cuenta:',e);
    toast('Error al eliminar la cuenta: '+e.message,'err');
  }
}

function initSupabase() {
  if (!window.supabase) return setTimeout(initSupabase, 100);
  sbClient = window.supabase.createClient(SB_URL, SB_KEY);

  sbClient.auth.getSession().then(({ data: { session } }) => {
    if (session) handleAuthSession(session);
    else render();
  });

  sbClient.auth.onAuthStateChange(async (ev, session) => {
    if (session) handleAuthSession(session);
    else {
      userSession = null;
      currentUserProfile = null;
      S.activeProfile = null;
      S.profiles = [];
      S.page = 'home';
      S.cid = null;
      S.workingTL = null;
      S.modal = null;
      history.replaceState(null,'',location.pathname);
      saveProfiles();
      render();
    }
  });
}
