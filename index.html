<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AnimeTier</title>

<!-- Fuentes -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">

<!-- PWA -->
<link rel="icon" href="./favicon.ico" type="image/x-icon">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Iconos / librerías externas (idénticas al original) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0/default.css">

<!-- Hoja de estilos propia de la app (antes estaba inline, ahora en /css) -->
<link rel="stylesheet" href="css/style.css">

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-main">

<!-- Toda la interfaz se construye dinámicamente en JS dentro de estos dos contenedores -->
<div id="app"></div>
<div class="tw" id="tw"></div>

<!--
  ============================================================================
  Carga de la lógica de la app en módulos clásicos (scripts normales, sin
  type="module") para no tener que tocar ninguna función interna.
  El ORDEN es importante: es exactamente el mismo orden en el que estaba
  el código dentro del <script> único original, así que el comportamiento
  en tiempo de ejecución es 100% idéntico.
  ============================================================================
-->

<!-- 1) Datos base (catálogo de personajes, tierlist de ejemplo, alias de búsqueda) -->
<script src="js/data/characters.js"></script>
<script src="js/data/tierlists-seed.js"></script>
<script src="js/data/aliases.js"></script>

<!-- 2) Capa de persistencia y estado global de la aplicación -->
<script src="js/core/storage.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/profile-helpers.js"></script>
<script src="js/core/save.js"></script>
<script src="js/core/editor-working-copy.js"></script>

<!-- 3) Utilidades de interfaz -->
<script src="js/ui/toast.js"></script>
<script src="js/core/char-helpers.js"></script>
<script src="js/services/anilist.js"></script>
<script src="js/ui/h-helper.js"></script>
<script src="js/ui/drag.js"></script>

<!-- 4) Vistas de la aplicación -->
<script src="js/views/nav.js"></script>
<script src="js/views/home.js"></script>
<script src="js/views/editor.js"></script>
<script src="js/views/modals.js"></script>

<!-- 5) Funcionalidades y lógica de aplicación -->
<script src="js/features/export-png.js"></script>
<script src="js/core/actions.js"></script>
<script src="js/core/router.js"></script>

<!-- 6) Render inicial + autenticación Supabase (arranca la app al final) -->
<script src="js/core/render.js"></script>
<script src="js/core/supabase-auth.js"></script>

</body>
</html>
