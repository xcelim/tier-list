<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AnimeTier</title>

<!-- Aplica el tema guardado (claro/oscuro) ANTES de que cargue nada más,
     para que no haya un parpadeo del tema incorrecto al abrir la página. -->
<script>
(function(){
  try{
    var t = JSON.parse(localStorage.getItem('at4_theme')||'null') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>

<body class="bg-main">

<!--
  Capa decorativa fija con el "campo de estrellas" cósmico y el resplandor
  ambiental. Es 100% CSS (sin JS), puramente visual y con
  aria-hidden/pointer-events:none, así que nunca puede interferir con la
  lógica de la app ni con el drag & drop.
-->
<div id="cosmic-fx" aria-hidden="true">
  <div class="cosmic-glow cosmic-glow-a"></div>
  <div class="cosmic-glow cosmic-glow-b"></div>
  <div class="cosmic-glow cosmic-glow-c"></div>
  <div class="cosmic-stars"></div>
  <div class="cosmic-stars cosmic-stars-2"></div>
</div>

<!-- Toda la interfaz se construye dinámicamente en JS dentro de estos dos contenedores -->
<div id="app"></div>
<div class="tw" id="tw"></div>

<!-- Cinta animada decorativa (100% CSS, sin JS) -->
<div id="hype-ticker" aria-hidden="true">
  <div class="hype-ticker-track">
    <span>✦&nbsp;&nbsp;BIENVENIDO AL SANTUARIO DEFINITIVO DEL WAIFU TIER LIST&nbsp;&nbsp;✦&nbsp;&nbsp;CREA&nbsp;&nbsp;·&nbsp;&nbsp;RANKEA&nbsp;&nbsp;·&nbsp;&nbsp;PRESUME&nbsp;&nbsp;✦&nbsp;&nbsp;TU WAIFU. TU TROPA. TU LEYENDA.&nbsp;&nbsp;✦&nbsp;&nbsp;</span>
    <span>✦&nbsp;&nbsp;BIENVENIDO AL SANTUARIO DEFINITIVO DEL WAIFU TIER LIST&nbsp;&nbsp;✦&nbsp;&nbsp;CREA&nbsp;&nbsp;·&nbsp;&nbsp;RANKEA&nbsp;&nbsp;·&nbsp;&nbsp;PRESUME&nbsp;&nbsp;✦&nbsp;&nbsp;TU WAIFU. TU TROPA. TU LEYENDA.&nbsp;&nbsp;✦&nbsp;&nbsp;</span>
  </div>
</div>

<!--
  ============================================================================
  Carga de la lógica de la app en módulos clásicos (scripts normales, sin
  type="module") para no tener que tocar ninguna función interna.
  El ORDEN es importante: es exactamente el mismo orden en el que estaba
  el código dentro del <script> único original, así que el comportamiento
  en tiempo de ejecución es 100% idéntico.
  ============================================================================
-->

<!-- 1) Datos base (catálogo de personajes, tierlist de ejemplo, alias de búsqueda) -->
<script src="js/data/characters.js"></script>
