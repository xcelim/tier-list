<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>AnimeTier</title>
<script>
  // Truco clásico de "SPA fallback" para GitHub Pages (repos de proyecto,
  // servidos bajo un subdirectorio como /tier-list/, no en la raíz del
  // dominio). Antes este archivo era una copia manual (y desactualizada) de
  // index.html con rutas relativas ("js/...", "css/..."): eso funcionaba
  // solo por pura casualidad para la home, pero se rompía si alguien entraba
  // (o recargaba) directo en una ruta interna de la app como
  // /tier-list/tierlists o /tier-list/editor/abc123 — las rutas relativas
  // "js/..." se resolvían mal (con un nivel de más) y además el contenido
  // podía quedarse desactualizado respecto al index.html real.
  //
  // Ahora este archivo NO duplica nada: cuando GitHub Pages sirve esto (por
  // no encontrar un archivo real en esa ruta), codificamos la ruta pedida
  // como query string y redirigimos al index.html de verdad, que la
  // decodifica y la restaura con history.replaceState ANTES de arrancar el
  // resto de la app (ver el script correspondiente al principio de
  // index.html). Así el index.html real siempre está al día (mismo
  // ?v= de caché, mismos assets) y las rutas profundas también sobreviven a
  // un F5.
  var pathSegmentsToKeep = 1; // nº de segmentos de "/tier-list/" a conservar
  var l = window.location;
  l.replace(
    l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
    l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
    l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
    l.hash
  );
</script>
</head>
<body></body>
</html>
